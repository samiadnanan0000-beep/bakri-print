at com.google.android.libraries.mapsplatform.secrets_gradle_plugin.SecretsPlugin.apply
```[cite: 18]

المشروع يحتوي على إضافة اسمها **`secrets-gradle-plugin`** (الخاصة بمفاتيح Google Maps أو الـ API)[cite: 18]. هذه الإضافة تبحث إجبارياً أثناء التجميع عن ملف اسمه **`secrets.properties`** أو **`local.properties`**، وبما أن الملف غير موجود في المستودع تفشل عملية البناء فوراً[cite: 18].

حل هذه المشكلة بسيط جداً؛ سنضيف خطوة صغيرة في `build.yml` تنشئ ملف `secrets.properties` تلقائياً قبل البناء:

---

### خطوات الحل:

1. اضغط على خيار **`Workflow file`** من القائمة الجانبية في أقصى اليسار[cite: 18].
2. اضغط على أيقونة القلم (✏️) للتعديل.
3. امسح المحتوى بالكامل وضع مكانه هذا الكود:

```yaml
name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create secrets and local properties
        run: |
          touch secrets.properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BakriPrint-APK
          path: app/build/outputs/apk/debug/*.apk
